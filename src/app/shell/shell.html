<div class="flex h-full">
  <nav class="flex w-16 shrink-0 flex-col items-center gap-2 border-r border-line bg-rail py-3" [attr.aria-label]="'nav.main' | translate">
    <img src="favicon.svg" alt="Loopme" class="mb-3 size-8" />
    @for (item of nav; track item.path) {
    <a
      [routerLink]="item.path"
      routerLinkActive="bg-accent-soft text-accent"
      class="flex size-10 items-center justify-center rounded-full text-muted transition-colors duration-150 hover:bg-raised hover:text-ink"
      [attr.aria-label]="item.label | translate"
      [title]="item.label | translate">
      <span class="material-symbols-outlined" aria-hidden="true">{{ item.icon }}</span>
    </a>
    }
    <button
      type="button"
      class="mt-auto flex size-10 items-center justify-center rounded-full text-muted transition-colors duration-150 hover:bg-raised hover:text-ink"
      (click)="signOut()"
      [attr.aria-label]="'nav.signOut' | translate: { email: auth.user()?.email ?? '' }"
      [title]="'nav.signOut' | translate: { email: auth.user()?.email ?? '' }">
      <span class="material-symbols-outlined" aria-hidden="true">logout</span>
    </button>
  </nav>
  <main class="min-w-0 flex-1 overflow-auto">
    <router-outlet />
  </main>
</div>
