# Deploys to the production Firebase project (billing-4e274) on every push to main:
# Hosting, Firestore rules and Cloud Functions. Runs the CI checks first.
#
# Needs the repository secret FIREBASE_SERVICE_ACCOUNT (a service account JSON key, see
# CLAUDE.md). Until it exists, the deploy job is skipped with a warning instead of failing.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Firebase (billing-4e274)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://billing.loopme.dk
    steps:
      - name: Check credentials
        id: creds
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT is not set, so nothing was deployed. See CLAUDE.md (Deploy)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install
        if: steps.creds.outputs.ready == 'true'
        run: |
          npm ci
          npm ci --prefix functions

      - name: Build web app (production)
        if: steps.creds.outputs.ready == 'true'
        run: npm run build

      - name: Authenticate to Google Cloud
        if: steps.creds.outputs.ready == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy (Hosting, Firestore rules, Functions)
        if: steps.creds.outputs.ready == 'true'
        run: npx firebase deploy --project prod --non-interactive --force
